[project]
name = "flux-shim"
version = "0.1.0"
description = "OpenAI-compatible chat-completions shim that serves FLUX.2 [klein] 4B."
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pillow>=10",
    # torch + diffusers installed separately on the GPU host
    # via --extra-index-url cu129 — see README. Tests do NOT need them
    # (pipeline is mocked).
]

[project.optional-dependencies]
gpu = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "diffusers>=0.37",
    "transformers>=4.56",
    "accelerate>=1.12",
    "huggingface-hub>=0.34,<1.0",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
